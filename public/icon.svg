<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8cff" />
      <stop offset="100%" stop-color="#7c5bff" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1420" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#2a3550" stroke-width="4"/>
  
  <!-- Outer Shield Aura -->
  <path d="M256 64 L416 128 V256 C416 352 344 432 256 464 C168 432 96 352 96 256 V128 Z" 
        fill="none" stroke="#5b8cff" stroke-width="6" opacity="0.3" filter="url(#glow)"/>
        
  <!-- Main Shield -->
  <path d="M256 80 L396 136 V250 C396 336 332 408 256 438 C180 408 116 336 116 250 V136 Z" 
        fill="url(#shieldGrad)" opacity="0.95"/>
        
  <!-- Inner Shield Cutout -->
  <path d="M256 116 L366 160 V246 C366 312 318 368 256 394 C194 368 146 312 146 246 V160 Z" 
        fill="#0f1420"/>
        
  <!-- Central Lock / Multi-layer Core -->
  <path d="M256 164 C236 164 220 180 220 200 V224 H212 C203 224 196 231 196 240 V312 C196 321 203 328 212 328 H300 C309 328 316 321 316 312 V240 C316 231 309 224 300 224 H292 V200 C292 180 276 164 256 164 Z M240 200 C240 191 247 184 256 184 C265 184 272 191 272 200 V224 H240 Z" 
        fill="url(#shieldGrad)"/>
        
  <!-- Core Keyhole and Circuit Line -->
  <circle cx="256" cy="268" r="8" fill="#3ddc97"/>
  <path d="M256 274 V296" stroke="#3ddc97" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="302" r="3" fill="#3ddc97"/>
</svg>
