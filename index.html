<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guardian Multi-Layer - サイト管理ダッシュボード</title>
    <meta name="description" content="多層セキュリティサイト管理ダッシュボード（MLSMD）。マスターキー緊急復旧、改ざん防止CRC-32ログ、制限信頼性検証、ウイルス検知、PWA対応。" />
    <meta property="og:title" content="Guardian Multi-Layer - サイト管理ダッシュボード" />
    <meta property="og:description" content="多層セキュリティサイト管理ダッシュボード（MLSMD）。マスターキー緊急復旧、改ざん防止CRC-32ログ、制限信頼性検証、ウイルス検知、PWA対応。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MLSMD" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="bg-[#0a0e1a] text-[#e8ecf6] antialiased selection:bg-[#5b8cff]/30 selection:text-white">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('PWA ServiceWorker registered with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('PWA ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
